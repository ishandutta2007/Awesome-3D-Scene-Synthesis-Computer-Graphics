<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0c102b"/><stop offset="100%" stop-color="#03050a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><line x1="0" x2="40" y1="0" y2="0" stroke="rgba(255,255,255,0.04)" stroke-width="1"/><line x1="0" x2="0" y1="0" y2="40" stroke="rgba(255,255,255,0.04)" stroke-width="1"/></pattern><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb3{0%{transform:translate(0,0)}}@keyframes pulseParticle{0%{opacity:.3;r:3px}}.orb-1{animation:floatOrb1 14s ease-in-out infinite alternate}.orb-2{animation:floatOrb2 18s ease-in-out infinite alternate}.orb-3{animation:floatOrb3 12s ease-in-out infinite alternate}.pulse-wire{stroke-dasharray:8,12;animation:dash 25s linear infinite}.splat-particle{animation:pulseParticle 4s ease-in-out infinite alternate}.badge-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.badge-text{font-weight:600;font-size:13px}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><g opacity=".45"><circle cx="220" cy="110" r="140" fill="#6366f1" class="orb-1" filter="url(#glow)"/><circle cx="980" cy="160" r="160" fill="#ec4899" class="orb-2" filter="url(#glow)"/><circle cx="620" cy="340" r="130" fill="#06b6d4" class="orb-3" filter="url(#glow)"/></g><g opacity=".3" transform="translate(0, 40)"><line x1="100" x2="600" y1="360" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire"/><line x1="300" x2="600" y1="360" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire"/><line x1="500" x2="600" y1="360" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire"/><line x1="700" x2="600" y1="360" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire"/><line x1="900" x2="600" y1="360" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire"/><line x1="1100" x2="600" y1="360" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire"/><line x1="250" x2="950" y1="310" y2="310" stroke="#c084fc" stroke-width="1"/><line x1="380" x2="820" y1="270" y2="270" stroke="#c084fc" stroke-width="1"/><line x1="480" x2="720" y1="235" y2="235" stroke="#c084fc" stroke-width=".8"/></g><g opacity=".6"><circle cx="1020" cy="90" r="4" fill="#38bdf8" class="splat-particle" filter="url(#softGlow)"/><circle cx="1080" cy="130" r="5" fill="#f472b6" class="splat-particle" filter="url(#softGlow)" style="animation-delay:1s"/><circle cx="940" cy="110" r="4.5" fill="#818cf8" class="splat-particle" filter="url(#softGlow)" style="animation-delay:2s"/><circle cx="1060" cy="220" r="4" fill="#a78bfa" class="splat-particle" filter="url(#softGlow)" style="animation-delay:.5s"/><circle cx="1120" cy="180" r="3.5" fill="#38bdf8" class="splat-particle" filter="url(#softGlow)" style="animation-delay:1.5s"/><circle cx="920" cy="240" r="5" fill="#ec4899" class="splat-particle" filter="url(#softGlow)" style="animation-delay:2.5s"/></g><g transform="translate(600, 52)"><rect width="340" height="36" x="-170" y="-18" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" backdrop-filter="blur(10px)" rx="18"/><circle cx="-145" cy="0" r="5" fill="#22c55e"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="-130" y="5" fill="#e2e8f0" class="badge-text" font-size="12">CURATED ECOSYSTEM &amp; BENCHMARK</text></g><g><text fill="rgba(0,0,0,0.85)" class="title-text" dy="3" font-size="44" text-anchor="middle" transform="translate(600, 142)">Awesome 3D Scene Synthesis</text><text fill="url(#accentGrad)" class="title-text" font-size="44" text-anchor="middle" transform="translate(600, 142)">Awesome 3D Scene Synthesis</text></g><g><text fill="#f8fafc" class="title-text" font-size="26" letter-spacing="1.5" text-anchor="middle" transform="translate(600, 195)">&amp; COMPUTER GRAPHICS</text></g><g><text fill="#94a3b8" class="sub-text" font-size="16" letter-spacing=".3" text-anchor="middle" transform="translate(600, 240)">Generative World Models • Radiance Fields (3DGS / NeRF) • Agentic Spatial Evolution • Real-Time Engines</text></g><g><g transform="translate(600, 315) translate(-400, 0)"><rect width="180" height="36" x="-90" y="-18" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" rx="18"/><text y="5" fill="#38bdf8" class="badge-text" text-anchor="middle">⚡ 3D Gaussian Splats</text></g><g transform="translate(600, 315) translate(-200, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" rx="18"/><text y="5" fill="#818cf8" class="badge-text" text-anchor="middle">🌐 World Models</text></g><g transform="translate(600, 315) translate(0, 0)"><rect width="190" height="36" x="-95" y="-18" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" rx="18"/><text y="5" fill="#c084fc" class="badge-text" text-anchor="middle">🤖 Agentic Evolution</text></g><g transform="translate(600, 315) translate(200, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#cardGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1" rx="18"/><text y="5" fill="#f472b6" class="badge-text" text-anchor="middle">📷 Neural Radiance</text></g><g transform="translate(600, 315) translate(400, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" rx="18"/><text y="5" fill="#34d399" class="badge-text" text-anchor="middle">🎮 Graphics Engines</text></g></g><line x1="150" x2="1050" y1="416" y2="416" stroke="url(#accentGrad)" stroke-width="2" opacity=".7"/></svg>