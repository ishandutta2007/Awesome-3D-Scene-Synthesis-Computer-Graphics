<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c102b" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>

    <!-- Animations -->
    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .orb-3 {
        animation: floatOrb3 12s ease-in-out infinite alternate;
      }
      .pulse-wire {
        stroke-dasharray: 8, 12;
        animation: dash 25s linear infinite;
      }
      .splat-particle {
        animation: pulseParticle 4s ease-in-out infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(40px, -40px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseParticle {
        0% { opacity: 0.3; r: 3px; }
        100% { opacity: 0.85; r: 5.5px; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Ambient Nebula Orbs (Background Layer) -->
  <g opacity="0.45">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#6366f1" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="160" r="160" fill="#ec4899" filter="url(#glow)" />
    <circle class="orb-3" cx="620" cy="340" r="130" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- 3D Geometric Scene Synthesis Wireframe Grid (Perspective floor) -->
  <g opacity="0.3" transform="translate(0, 40)">
    <line x1="100" y1="360" x2="600" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire" />
    <line x1="300" y1="360" x2="600" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire" />
    <line x1="500" y1="360" x2="600" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire" />
    <line x1="700" y1="360" x2="600" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire" />
    <line x1="900" y1="360" x2="600" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire" />
    <line x1="1100" y1="360" x2="600" y2="200" stroke="#818cf8" stroke-width="1.2" class="pulse-wire" />

    <line x1="250" y1="310" x2="950" y2="310" stroke="#c084fc" stroke-width="1" />
    <line x1="380" y1="270" x2="820" y2="270" stroke="#c084fc" stroke-width="1" />
    <line x1="480" y1="235" x2="720" y2="235" stroke="#c084fc" stroke-width="0.8" />
  </g>

  <!-- Gaussian Splatting Dynamic Particles Cluster (Right-side background) -->
  <g opacity="0.6">
    <circle class="splat-particle" cx="1020" cy="90" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="splat-particle" cx="1080" cy="130" r="5" fill="#f472b6" filter="url(#softGlow)" style="animation-delay: 1s;" />
    <circle class="splat-particle" cx="940" cy="110" r="4.5" fill="#818cf8" filter="url(#softGlow)" style="animation-delay: 2s;" />
    <circle class="splat-particle" cx="1060" cy="220" r="4" fill="#a78bfa" filter="url(#softGlow)" style="animation-delay: 0.5s;" />
    <circle class="splat-particle" cx="1120" cy="180" r="3.5" fill="#38bdf8" filter="url(#softGlow)" style="animation-delay: 1.5s;" />
    <circle class="splat-particle" cx="920" cy="240" r="5" fill="#ec4899" filter="url(#softGlow)" style="animation-delay: 2.5s;" />
  </g>

  <!-- Top Decorative Pill / Tag -->
  <g transform="translate(600, 52)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" backdrop-filter="blur(10px)" />
    <circle cx="-145" cy="0" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-130" y="5" fill="#e2e8f0" class="badge-text" font-size="12">CURATED ECOSYSTEM &amp; BENCHMARK</text>
  </g>

  <!-- Main Headline Title (Crisp, High-Contrast Foreground) -->
  <g transform="translate(600, 142)">
    <!-- Shadow for ultra legibility -->
    <text text-anchor="middle" class="title-text" font-size="44" fill="rgba(0,0,0,0.85)" dy="3">Awesome 3D Scene Synthesis</text>
    <text text-anchor="middle" class="title-text" font-size="44" fill="url(#accentGrad)">Awesome 3D Scene Synthesis</text>
  </g>

  <!-- Secondary Title -->
  <g transform="translate(600, 195)">
    <text text-anchor="middle" class="title-text" font-size="26" fill="#f8fafc" letter-spacing="1.5">
      &amp; COMPUTER GRAPHICS
    </text>
  </g>

  <!-- Subtitle / Value Proposition Description -->
  <g transform="translate(600, 240)">
    <text text-anchor="middle" class="sub-text" font-size="16" fill="#94a3b8" letter-spacing="0.3">
      Generative World Models • Radiance Fields (3DGS / NeRF) • Agentic Spatial Evolution • Real-Time Engines
    </text>
  </g>

  <!-- Interactive Category Pills (Foreground Bottom Deck) -->
  <g transform="translate(600, 315)">
    <!-- Pill 1: 3D Gaussian Splatting -->
    <g transform="translate(-400, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text text-anchor="middle" y="5" fill="#38bdf8" class="badge-text">⚡ 3D Gaussian Splats</text>
    </g>

    <!-- Pill 2: World Generation -->
    <g transform="translate(-200, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <text text-anchor="middle" y="5" fill="#818cf8" class="badge-text">🌐 World Models</text>
    </g>

    <!-- Pill 3: Agentic Layouts -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
      <text text-anchor="middle" y="5" fill="#c084fc" class="badge-text">🤖 Agentic Evolution</text>
    </g>

    <!-- Pill 4: Neural Reconstruction -->
    <g transform="translate(200, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1" />
      <text text-anchor="middle" y="5" fill="#f472b6" class="badge-text">📷 Neural Radiance</text>
    </g>

    <!-- Pill 5: Real-time Graphics -->
    <g transform="translate(400, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
      <text text-anchor="middle" y="5" fill="#34d399" class="badge-text">🎮 Graphics Engines</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow Line -->
  <line x1="150" y1="416" x2="1050" y2="416" stroke="url(#accentGrad)" stroke-width="2" opacity="0.7" />
</svg>
